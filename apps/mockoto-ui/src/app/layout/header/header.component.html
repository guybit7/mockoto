<header class="flex h-14 shrink-0 items-center justify-between border-b border-gray-200 bg-white px-4 dark:border-gray-700 dark:bg-gray-900">
  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb">
    <ol class="flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400">
      <li>
        <a routerLink="/projects" class="hover:text-gray-900 dark:hover:text-gray-100">Projects</a>
      </li>

      @if (activeRoute.activeProjectId()) {
        <li class="flex items-center gap-1">
          <span class="text-gray-300 dark:text-gray-600">/</span>
          <a
            [routerLink]="['/projects', activeRoute.activeProjectId(), 'sessions']"
            class="hover:text-gray-900 dark:hover:text-gray-100"
          >
            {{ activeRoute.activeProjectId() }}
          </a>
        </li>
      }

      @if (activeRoute.activeSessionId()) {
        <li class="flex items-center gap-1">
          <span class="text-gray-300 dark:text-gray-600">/</span>
          <a
            [routerLink]="[
              '/projects', activeRoute.activeProjectId(),
              'sessions', activeRoute.activeSessionId(),
              'mocks'
            ]"
            class="hover:text-gray-900 dark:hover:text-gray-100"
          >
            {{ activeRoute.activeSessionId() }}
          </a>
        </li>
      }
    </ol>
  </nav>

  <!-- Theme toggle -->
  <button
    (click)="toggle()"
    class="flex h-8 w-8 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-100"
    [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    @if (isDark()) {
      <!-- Sun icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    } @else {
      <!-- Moon icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    }
  </button>
</header>
