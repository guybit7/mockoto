name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Test
        run: npm exec nx -- test mockoto-be
        env:
          NX_NO_CLOUD: true

      - name: Build
        run: npm run build:cli
        env:
          NX_NO_CLOUD: true
